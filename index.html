<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FSH Predict — AI Match Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0A0E17; --surface:#10141F; --surface2:#161B29;
    --border:rgba(148,163,184,.10); --text:#E8ECF4; --dim:#8D97AC; --faint:#5B6478;
    --gold:#5B7CFA; --green:#22C08D; --amber:#E0A93E; --red:#E5534B; --live:#22C08D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
  @media (min-width:900px){
    .wrap{max-width:880px;padding:28px 24px 56px}
    header .brand{font-size:32px}
    nav button{font-size:17px;padding:12px 18px}
  }
  @media (min-width:1200px){
    .wrap{max-width:1080px}
  }
  .disp{font-family:'Inter',sans-serif}
  header .brand{font-weight:700;font-size:26px;letter-spacing:1px}
  header .brand span{color:var(--gold)}
  header .sub{font-size:10.5px;color:var(--faint);letter-spacing:2px;text-transform:uppercase}
  .hdr-row{display:flex;justify-content:space-between;align-items:center}
  .live-ind{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--live)}
  .dot{position:relative;width:8px;height:8px;display:inline-flex}
  .dot::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--live);animation:pulse 1.6s ease-out infinite}
  .dot::after{content:"";position:relative;width:8px;height:8px;border-radius:50%;background:var(--live)}
  @keyframes pulse{to{transform:scale(2.6);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  nav{display:flex;gap:4px;overflow-x:auto;margin-top:16px;border-bottom:1px solid var(--border);scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{padding:10px 13px;background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);
    font-family:'Inter',sans-serif;font-weight:600;font-size:15.5px;letter-spacing:.8px;text-transform:uppercase;
    cursor:pointer;white-space:nowrap;flex-shrink:0}
  nav button.on{color:var(--text);border-bottom-color:var(--gold)}
  nav button:focus-visible,select:focus,input:focus,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
  .stitle{font-family:'Inter',sans-serif;font-weight:600;font-size:18px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--dim);margin:18px 2px 10px}
  .badge{font-size:10px;font-weight:700;letter-spacing:1.2px;padding:3px 8px;border-radius:4px;text-transform:uppercase;
    color:var(--dim);background:rgba(148,163,184,.10);white-space:nowrap}
  .badge.green{color:var(--green);background:rgba(47,201,102,.12)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--dim);
    font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:'Inter',sans-serif}
  .chip.on{border-color:var(--gold);background:rgba(91,124,250,.14);color:var(--gold)}

  .pct{font-family:'Inter',sans-serif;font-weight:700;font-size:20px;line-height:1;letter-spacing:.5px}
  .meter{display:flex;gap:2px;margin-top:3px;justify-content:flex-end}
  .meter i{width:8px;height:3px;border-radius:2px;background:rgba(148,163,184,.18)}
  .probwrap{display:flex;flex-direction:column;align-items:flex-end;min-width:52px}

  .msg{text-align:center;color:var(--dim);font-size:13px;padding:26px 14px}
  .spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;
    margin:0 auto 12px;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  .row{display:flex;justify-content:space-between;align-items:center}
  .team{font-family:'Inter',sans-serif;font-weight:600;font-size:18px}
  .logo{width:22px;height:22px;object-fit:contain;vertical-align:-5px;margin-right:8px}
  .score{font-family:'Inter',sans-serif;font-weight:700;font-size:28px;color:var(--gold);letter-spacing:2px;padding:0 14px}
  .ko{font-family:'Inter',sans-serif;font-weight:700;font-size:20px;color:var(--gold);text-align:center}
  .kol{font-size:10px;color:var(--faint);letter-spacing:1px;text-align:center}
  .bar{height:6px;border-radius:3px;background:rgba(148,163,184,.12);overflow:hidden;flex:1.4}
  .bar i{display:block;height:100%;border-radius:3px;transition:width .6s ease}

  input[type=text],input[type=password]{width:100%;padding:11px 12px;border-radius:10px;background:var(--surface2);
    border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;margin-bottom:10px;display:block}
  .results{background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-top:6px;max-height:190px;overflow-y:auto}
  .results div{padding:10px 12px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--border)}
  .results div:hover{background:rgba(91,124,250,.10)}
  .btn{width:100%;padding:13px;border-radius:10px;border:none;background:var(--gold);color:#fff;
    font-weight:700;font-size:14.5px;cursor:pointer;font-family:'Inter',sans-serif;margin-top:12px}
  .btn:disabled{opacity:.45}
  .foot{margin-top:28px;text-align:center;font-size:10.5px;color:var(--faint);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hdr-row">
      <div>
        <div class="brand disp">FSH <span>PREDICT</span></div>
        <div class="sub">AI Match Intelligence · 5-Year Predictive Model</div>
      </div>
      <div class="live-ind"><span class="dot"></span><span id="liveCount">—</span></div>
    </div>
    <div id="roleControls" style="text-align:right;margin-top:6px"></div>
    <nav id="nav"></nav>
  </header>
  <main id="main"></main>
  <div class="foot">Probabilities are model estimates, not guarantees.<br/>FSH Empire · Predict responsibly. 18+</div>
</div>

<script>
/* ================= CONFIG ================= */
const API = "https://fsh-predict-backend.onrender.com";
const LIVE_POLL_MS = 90_000;

const TABS = [
  ["today","Today's Games"],["stats","Stats"],["top","Top Predictions"],
  ["live","Live Scores"],["livepred","Live Predictions"],["highodds","Daily Bomb"],["cscore","Correct Score"],
];
const CONTINENTS = ["All","Europe","South America","North America","Africa","Asia"];

const $ = (s,el=document)=>el.querySelector(s);
const esc = (s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bandColor = p => p>=70?"var(--green)":p>=50?"var(--amber)":"var(--red)";
const probChip = (p,big=false)=>`<div class="probwrap">
  <span class="pct" style="color:${bandColor(p)};${big?'font-size:26px':''}">${p}%</span>
  <span class="meter">${[1,2,3,4,5].map(i=>`<i style="${p>=i*20?`background:${bandColor(p)}`:''}"></i>`).join("")}</span></div>`;
const spinner = (t)=>`<div class="msg"><div class="spin"></div>${esc(t)}</div>`;

/** Shared "was it right" badge for graded picks. result is "correct"|"wrong"|null. */
function resultBadge(result, finalScore){
  if(result==="correct") return `<div style="margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--green)">✓ CORRECT · FT ${esc(finalScore)}</div>`;
  if(result==="wrong") return `<div style="margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--red)">✗ WRONG · FT ${esc(finalScore)}</div>`;
  return `<div style="margin-top:8px;font-size:10.5px;color:var(--faint)">⏳ Pending — not finished yet</div>`;
}
function resultBorder(result, fallback){
  if(result==="correct") return "var(--green)";
  if(result==="wrong") return "var(--red)";
  return fallback;
}

/** Copies text to clipboard for pasting into a betting app's search box.
 *  Shows a brief "Copied" flash on the tapped element instead of an alert. */
async function copyToClipboard(text, el){
  try{
    await navigator.clipboard.writeText(text);
    const original = el.textContent;
    el.textContent = "✓ Copied";
    setTimeout(()=>{ el.textContent = original; }, 1200);
  }catch{
    el.textContent = "Copy failed — long-press to select";
    setTimeout(()=>{ el.textContent = "📋 "+text; }, 1500);
  }
}
/** Small tap-to-copy chip for a single team name — paste straight into
 *  SportyBet's (or any bookmaker's) search box instead of retyping. */
function copyChip(name){
  const safe = esc(name).replace(/'/g,"&#39;");
  return `<button onclick="copyToClipboard('${safe.replace(/"/g,'&quot;')}',this)"
    style="background:var(--surface2);border:1px solid var(--border);color:var(--dim);font-size:10.5px;
    padding:3px 8px;border-radius:6px;margin:2px 4px 0 0;cursor:pointer;font-family:'Inter',sans-serif">📋 ${esc(name)}</button>`;
}

let wokeUp=false;
async function api(path){
  const slowTimer = setTimeout(()=>{ if(!wokeUp){ const m=$("#wakeMsg"); if(m) m.style.display="block"; } }, 4000);
  try{
    const r = await fetch(API+path);
    wokeUp = true;
    clearTimeout(slowTimer);
    if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.error||("HTTP "+r.status)); }
    return await r.json();
  }finally{ clearTimeout(slowTimer); }
}
const wakeNote = `<div id="wakeMsg" style="display:none" class="msg">Free server is waking up — first load can take up to a minute. Hang tight…</div>`;

/* ================= AUTH / LOCK =================
   Client-side only — no server, no database. The password hash and the
   security-question answers below live in this file, which is public on
   GitHub Pages. This keeps out casual visitors; it is NOT real security —
   don't rely on it to protect anything sensitive. */
const LS_HASH = "fsh_pw_hash";
/* Paste your password's hash here so it's baked into the deployed file —
   this is what makes it the SAME lock for every visitor, not just your
   own phone. Get this value from Admin → "Show sync code" after you set
   your password, then paste it here and redeploy. Leave empty ("") to
   let the first visitor on each device set their own (old behavior). */
const HARDCODED_HASH = "8cfc62cabfffdfec9d65c114c4b630246b6cc3795fa74a2d670fefdd0a216b4d";
const LS_ROLE = "fsh_role";
const GUEST_TABS = ["stats","top","cscore"];
const SECURITY_Q = [
  { q: "What is your wife's pet's name?", hash: "c60dc706a86317eea23f2f2e2c4b9f2d4956469f992fd1b46c4365a336879e87" },
  { q: "What is your childhood nickname?", hash: "07c05679b1cfed895de0d8383a02cafb7a040d5db41878fa2c47103fe7aba541" },
];

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
const getRole = () => localStorage.getItem(LS_ROLE);
const setRole = (r) => { if(r) localStorage.setItem(LS_ROLE,r); else localStorage.removeItem(LS_ROLE); };
const hasPassword = () => !!localStorage.getItem(LS_HASH) || !!HARDCODED_HASH;
const currentHash = () => localStorage.getItem(LS_HASH) || HARDCODED_HASH;

let role = getRole();
let gateStage = null;       // null | setup | choice | login | pwchange-q | pwchange-new
let gateError = "";
let pwChangeQStep = 0;

function onEnter(id, fn){ const el=$(id); if(el) el.addEventListener("keydown", e=>{ if(e.key==="Enter") fn(); }); }

function renderGate(){
  $("#nav").style.display = "none";
  const m = $("#main");
  const box = (title, body) => `<div class="card" style="max-width:360px;margin:32px auto">
    <div class="disp" style="font-weight:700;font-size:20px;margin-bottom:12px">${title}</div>${body}
    ${gateError?`<div style="color:var(--red);font-size:12px;margin:-2px 0 10px">${esc(gateError)}</div>`:""}
  </div>`;

  if(gateStage==="setup"){
    m.innerHTML = box("Set Admin Password", `
      <div style="font-size:12px;color:var(--dim);margin-bottom:12px">Create a password to unlock full access on this device. No username needed.</div>
      <input type="password" id="pwNew1" placeholder="New password"/>
      <input type="password" id="pwNew2" placeholder="Confirm password"/>
      <button class="btn" id="pwSetBtn">Create &amp; log in</button>`);
    const submit = async ()=>{
      const p1=$("#pwNew1").value, p2=$("#pwNew2").value;
      if(p1.length<4){ gateError="Password must be at least 4 characters."; renderGate(); return; }
      if(p1!==p2){ gateError="Passwords don't match."; renderGate(); return; }
      localStorage.setItem(LS_HASH, await sha256(p1));
      setRole("admin"); role="admin"; gateStage=null; gateError=""; tab="top";
      render();
    };
    $("#pwSetBtn").onclick=submit; onEnter("#pwNew2",submit);
  }

  else if(gateStage==="choice"){
    m.innerHTML = box("FSH Predict is locked", `
      <button class="btn" id="adminLoginBtn">🔒 Admin login</button>
      <button class="btn" id="guestBtn" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);margin-top:10px">👤 Continue as guest</button>`);
    $("#adminLoginBtn").onclick=()=>{ gateStage="login"; gateError=""; renderGate(); };
    $("#guestBtn").onclick=()=>{ setRole("guest"); role="guest"; gateStage=null; tab="stats"; render(); };
  }

  else if(gateStage==="login"){
    m.innerHTML = box("Admin Login", `
      <input type="password" id="pwLogin" placeholder="Password"/>
      <button class="btn" id="pwLoginBtn">Unlock</button>
      <button class="btn" id="backBtn" style="background:none;color:var(--dim)">← Back</button>`);
    const submit = async ()=>{
      const hash = await sha256($("#pwLogin").value);
      if(hash===currentHash()){
        setRole("admin"); role="admin"; gateStage=null; gateError=""; tab="top"; render();
      } else { gateError="Incorrect password."; renderGate(); }
    };
    $("#pwLoginBtn").onclick=submit; onEnter("#pwLogin",submit);
    $("#backBtn").onclick=()=>{ gateStage="choice"; gateError=""; renderGate(); };
  }

  else if(gateStage==="pwchange-q"){
    const step = SECURITY_Q[pwChangeQStep];
    m.innerHTML = box("Verify it's you", `
      <div style="font-size:13px;color:var(--dim);margin-bottom:10px">${esc(step.q)}</div>
      <input type="text" id="secAnswer" placeholder="Your answer"/>
      <button class="btn" id="secSubmitBtn">Submit</button>
      ${pwChangeQStep===0?`<button class="btn" id="secForgotBtn" style="background:none;color:var(--dim);margin-top:6px">I don't remember — try another question</button>`:""}
      <button class="btn" id="secCancelBtn" style="background:none;color:var(--faint);margin-top:4px">Cancel</button>`);
    const submit = async ()=>{
      const ans=($("#secAnswer").value||"").trim().toLowerCase();
      const ansHash = await sha256(ans);
      if(ansHash===step.hash){ gateStage="pwchange-new"; gateError=""; renderGate(); return; }
      gateError = pwChangeQStep===0
        ? "That's not it — try again, or use the link below."
        : "That's not it either. If you're truly stuck, clear this site's browser data to reset the lock (you'll set a fresh password — nothing else is stored).";
      renderGate();
    };
    $("#secSubmitBtn").onclick=submit; onEnter("#secAnswer",submit);
    if($("#secForgotBtn")) $("#secForgotBtn").onclick=()=>{ pwChangeQStep=1; gateError=""; renderGate(); };
    $("#secCancelBtn").onclick=()=>{ gateStage=null; pwChangeQStep=0; gateError=""; render(); };
  }

  else if(gateStage==="pwchange-new"){
    m.innerHTML = box("Set New Password", `
      <input type="password" id="pwChange1" placeholder="New password"/>
      <input type="password" id="pwChange2" placeholder="Confirm new password"/>
      <button class="btn" id="pwChangeSaveBtn">Save new password</button>`);
    const submit = async ()=>{
      const p1=$("#pwChange1").value, p2=$("#pwChange2").value;
      if(p1.length<4){ gateError="Password must be at least 4 characters."; renderGate(); return; }
      if(p1!==p2){ gateError="Passwords don't match."; renderGate(); return; }
      localStorage.setItem(LS_HASH, await sha256(p1));
      gateStage=null; pwChangeQStep=0; gateError="";
      render();
    };
    $("#pwChangeSaveBtn").onclick=submit; onEnter("#pwChange2",submit);
  }
}

function renderRoleControls(){
  const el = $("#roleControls");
  if(!el) return;
  if(role==="admin"){
    el.innerHTML = `<span style="font-size:11px;color:var(--dim)">
      <a href="#" id="syncLink" style="color:var(--gold);text-decoration:none">Show sync code</a> ·
      <a href="#" id="changePwLink" style="color:var(--gold);text-decoration:none">Change password</a> ·
      <a href="#" id="lockLink" style="color:var(--faint);text-decoration:none">🔒 Lock</a></span>
      <div id="syncBox" style="display:none;margin-top:8px;text-align:left"></div>`;
    $("#changePwLink").onclick=(e)=>{e.preventDefault(); gateStage="pwchange-q"; pwChangeQStep=0; gateError=""; render();};
    $("#lockLink").onclick=(e)=>{e.preventDefault(); setRole(null); role=null; gateStage="choice"; render();};
    $("#syncLink").onclick=(e)=>{
      e.preventDefault();
      const box=$("#syncBox");
      box.style.display = box.style.display==="none" ? "block" : "none";
      box.innerHTML = `<div class="card" style="padding:10px 12px">
        <div style="font-size:11px;color:var(--dim);margin-bottom:6px">
          Copy this and send it to Claude to bake into the site's code — every visitor will then see the same lock, not just this device.</div>
        <input type="text" readonly value="${currentHash()}" onclick="this.select()" style="font-size:11px;margin-bottom:0"/></div>`;
    };
  } else if(role==="guest"){
    el.innerHTML = `<span style="font-size:11px;color:var(--dim)">Guest mode ·
      <a href="#" id="adminUpLink" style="color:var(--gold);text-decoration:none">Admin login</a></span>`;
    $("#adminUpLink").onclick=(e)=>{e.preventDefault(); setRole(null); role=null; gateStage="choice"; render();};
  } else {
    el.innerHTML = "";
  }
}

/* ================= STATE ================= */
let tab="today", continent="All", country="All";

/* Shared "finished / ongoing / both" filter, reused across Top Predictions,
   Live Predictions, Daily Bomb, and Correct Score. */
let resultFilter="both"; // "both" | "ongoing" | "finished"
const passesFilter = (result) =>
  resultFilter==="both" ? true :
  resultFilter==="finished" ? result!==null :
  result===null; // ongoing = not yet graded (still pending)
const filterChipsHTML = () => `<div class="chips">
  ${[["both","Both"],["ongoing","Ongoing"],["finished","Finished"]].map(([id,l])=>
    `<button class="chip ${resultFilter===id?'on':''}" data-rf="${id}">${l}</button>`).join("")}</div>`;
function wireFilterChips(rerenderFn){
  document.querySelectorAll("[data-rf]").forEach(b=>b.onclick=()=>{ resultFilter=b.dataset.rf; rerenderFn(); });
}
let todayData=null, liveTimer=null;
let teamA=null, teamB=null;

/* ================= NAV ================= */
function renderNav(){
  const visible = role==="guest" ? TABS.filter(([id])=>GUEST_TABS.includes(id)) : TABS;
  $("#nav").style.display = "";
  $("#nav").innerHTML = visible.map(([id,l])=>`<button class="${tab===id?'on':''}" data-t="${id}">${l}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
}

/* ================= TODAY ================= */
async function viewToday(){
  const m=$("#main");
  if(!todayData){
    m.innerHTML = wakeNote + spinner("Loading today's fixtures…");
    try{ todayData = (await api("/api/today")).matches; }
    catch(e){ m.innerHTML = `<div class="msg">Couldn't load fixtures: ${esc(e.message)}<br/><br/><button class="btn" style="width:auto;padding:10px 22px" onclick="todayData=null;render()">Retry</button></div>`; return; }
  }
  const countries = ["All",...new Set(todayData.filter(x=>continent==="All"||x.continent===continent).map(x=>x.country))];
  let list = todayData.filter(x=>(continent==="All"||x.continent===continent)&&(country==="All"||x.country===country));
  const byLeague={}; list.forEach(x=>(byLeague[x.league]=byLeague[x.league]||[]).push(x));

  m.innerHTML = `
    <div class="chips">${CONTINENTS.map(c=>`<button class="chip ${continent===c?'on':''}" data-c="${c}">${c}</button>`).join("")}</div>
    <div class="chips">${countries.map(c=>`<button class="chip ${country===c?'on':''}" data-k="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    ${Object.entries(byLeague).map(([lg,ms])=>`
      <div class="stitle">${esc(lg)}</div>
      ${ms.map(x=>{
        const t=new Date(x.date).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
        const fin = x.status==="FT", liveNow = ["1H","2H","HT","ET"].includes(x.status);
        return `<div class="card"><div class="row">
          <div style="flex:1">
            <div class="team" style="margin-bottom:8px"><img class="logo" src="${esc(x.home.logo)}" alt=""/>${esc(x.home.name)}</div>
            <div class="team"><img class="logo" src="${esc(x.away.logo)}" alt=""/>${esc(x.away.name)}</div>
          </div>
          <div style="width:1px;align-self:stretch;background:var(--border);margin:0 14px"></div>
          <div style="min-width:56px">
            ${fin||liveNow
              ? `<div class="ko">${x.goals.home??0}–${x.goals.away??0}</div><div class="kol">${liveNow?(x.minute+"'"):"FT"}</div>`
              : `<div class="ko">${t}</div><div class="kol">KICKOFF</div>`}
          </div></div></div>`;
      }).join("")}`).join("") || `<div class="msg">No major-league fixtures match this filter today.</div>`}`;

  m.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{continent=b.dataset.c;country="All";render();});
  m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{country=b.dataset.k;render();});
}

/* ================= STATS ================= */
function teamPicker(slot){
  return `<div style="flex:1;position:relative">
    <input type="text" id="q${slot}" placeholder="Search team ${slot==="A"?"1":"2"}…" autocomplete="off"
      value="${slot==="A"?esc(teamA?.name||""):esc(teamB?.name||"")}"/>
    <div class="results" id="r${slot}" style="display:none"></div>
  </div>`;
}
async function viewStats(){
  const m=$("#main");
  m.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center;margin:6px 0 4px">
      ${teamPicker("A")}<span class="disp" style="font-weight:700;color:var(--faint)">VS</span>${teamPicker("B")}
    </div>
    <button class="btn" id="analyze" ${teamA&&teamB?"":"disabled"}>Analyze head-to-head</button>
    <div id="statsOut"></div>`;

  for(const slot of ["A","B"]){
    const input=$("#q"+slot), box=$("#r"+slot); let deb;
    input.oninput=()=>{ clearTimeout(deb);
      const q=input.value.trim();
      if(q.length<3){box.style.display="none";return;}
      deb=setTimeout(async()=>{
        box.style.display="block"; box.innerHTML=`<div style="color:var(--dim)">Searching…</div>`;
        try{
          const {teams,provider}=await api("/api/teams/search?q="+encodeURIComponent(q));
          teams.forEach(t=>t._provider=provider);
          box.innerHTML = teams.length? teams.slice(0,8).map(t=>
            `<div data-id="${t.id}" data-name="${esc(t.name)}"><img class="logo" src="${esc(t.logo)}" alt=""/>${esc(t.name)} <span style="color:var(--faint);font-size:11px">${esc(t.country||"")}</span></div>`).join("")
            : `<div style="color:var(--dim)">No teams found</div>`;
          box.querySelectorAll("[data-id]").forEach(d=>d.onclick=()=>{
            const pick={id:+d.dataset.id,name:d.dataset.name,provider:teams[0]?._provider};
            if(slot==="A")teamA=pick;else teamB=pick;
            render();
          });
        }catch(e){ box.innerHTML=`<div style="color:var(--red)">${esc(e.message)}</div>`; }
      },500);
    };
  }

  $("#analyze").onclick=async()=>{
    const out=$("#statsOut");
    out.innerHTML = wakeNote + spinner("Crunching 5 years of head-to-head…");
    try{
      const providerParam = (teamA.provider && teamA.provider===teamB.provider) ? `?provider=${teamA.provider}` : "";
      const d=await api(`/api/h2h/${teamA.id}/${teamB.id}${providerParam}`);
      const s=d.summary, p=d.prediction;
      const outcomes=[[teamA.name+" win",p.probs.home],["Draw",p.probs.draw],[teamB.name+" win",p.probs.away]];
      out.innerHTML=`
        <div class="card" style="margin-top:12px">
          <div style="display:flex;justify-content:space-around;text-align:center">
            ${[[Math.round(s.homeRate*s.meetings),teamA.name+" wins","var(--green)"],
               [Math.round(s.drawRate*s.meetings),"Draws","var(--amber)"],
               [Math.round(s.awayRate*s.meetings),teamB.name+" wins","var(--red)"]].map(([n,l,c])=>
              `<div><div class="disp" style="font-weight:700;font-size:32px;color:${c}">${n}</div>
               <div style="font-size:10.5px;color:var(--dim)">${esc(l)}</div></div>`).join("")}
          </div>
          <div style="font-size:10px;color:var(--faint);text-align:center;margin-top:8px;letter-spacing:1px">
            ${s.earliestYear ? `${s.earliestYear}\u2013${s.latestYear}` : "NO DATA"} · ${s.meetings} MEETINGS ${p.confidence==="low-sample"?"· ⚠ SMALL SAMPLE":""}</div>
        </div>
        <div class="stitle">Match outcome model</div>
        <div class="card">${outcomes.map(([n,pc])=>`
          <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
            <span style="flex:1;font-size:14px;font-weight:600">${esc(n)}</span>
            <span class="bar"><i style="width:${pc}%;background:${bandColor(pc)}"></i></span>
            ${probChip(pc)}</div>`).join("")}</div>
        <div class="stitle">Best markets</div>
        ${p.markets.map(mk=>{
          const nm = mk.name.replace("Home",teamA.name).replace("Away",teamB.name);
          return `<div class="card row" style="padding:12px 14px">
            <div><div style="font-size:14px;font-weight:600">${esc(nm)}</div>
            <div style="font-size:10.5px;color:${bandColor(mk.p)};font-weight:700;letter-spacing:1px;margin-top:3px">
              ${mk.p>=70?"HIGH":mk.p>=50?"MODERATE":"LOW"} CONFIDENCE</div></div>${probChip(mk.p)}</div>`;}).join("")}
        <div class="stitle">Recent meetings</div>
        <div class="card" style="padding:0">${d.meetings.map((mt,i)=>`
          <div style="display:flex;align-items:center;padding:10px 14px;${i<d.meetings.length-1?"border-bottom:1px solid var(--border)":""}">
            <span style="width:84px;font-size:11.5px;color:var(--faint)">${esc(mt.date)}</span>
            <span style="flex:1;font-size:12px;color:var(--dim)">${esc(mt.home)} v ${esc(mt.away)}</span>
            <span class="disp" style="font-weight:700;font-size:17px">${esc(mt.score)}</span>
          </div>`).join("")}</div>`;
    }catch(e){ out.innerHTML=`<div class="msg">Analysis failed: ${esc(e.message)}</div>`; }
  };
}

/* ================= TOP PREDICTIONS ================= */

function renderTopList(){
  const picks = topPicksCache.filter(pk=>passesFilter(pk.result));
  $("#main").innerHTML = filterChipsHTML() + `
      <div style="display:flex;align-items:center;gap:8px;margin:6px 2px 12px">
        <span class="badge green">≥ 70% ONLY</span>
        <span style="font-size:12px;color:var(--dim)">${picks.length} shown</span></div>
      ${picks.length? picks.map((pk,i)=>`
        <div class="card" style="border-left:3px solid ${resultBorder(pk.result,'var(--green)')}">
          <div class="row" style="align-items:flex-start;gap:10px">
            <div style="flex:1">
              <div style="display:flex;gap:8px;align-items:center;margin-bottom:5px">
                <span class="disp" style="font-weight:700;color:var(--faint)">#${i+1}</span>
                <span class="badge">${esc(pk.league)}</span></div>
              <div style="font-size:13px;color:var(--dim);margin-bottom:3px">${esc(pk.match)}</div>
              <div>${copyChip(pk.home)}${copyChip(pk.away)}</div>
              <div class="disp" style="font-weight:700;font-size:20px">${esc(pk.market)}</div>
              <div style="font-size:11px;color:var(--faint);margin-top:5px">
                KO ${new Date(pk.kickoff).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>
              ${resultBadge(pk.result,pk.finalScore)}
            </div>${probChip(pk.p,true)}</div></div>`).join("")
        : `<div class="msg">No picks match this filter.</div>`}`;
  wireFilterChips(renderTopList);
}
async function viewTop(){
  const m=$("#main");
  m.innerHTML = wakeNote + spinner("Model is scanning today's major fixtures — first run of the day takes a couple of minutes…");
  try{
    const {picks}=await api("/api/top-predictions");
    topPicksCache = picks;
    renderTopList();
  }catch(e){ m.innerHTML=`<div class="msg">Couldn't build predictions: ${esc(e.message)}</div>`; }
}

/* ================= LIVE ================= */
async function loadLive(){
  try{
    const {matches}=await api("/api/live");
    $("#liveCount").textContent = matches.length+" LIVE";
    return matches;
  }catch(e){ $("#liveCount").textContent="OFFLINE"; throw e; }
}
async function viewLive(){
  const m=$("#main");
  m.innerHTML = wakeNote + spinner("Fetching live matches…");
  const draw=(matches)=>{
    m.innerHTML = matches.length? matches.map(x=>`
      <div class="card">
        <div class="row" style="margin-bottom:10px"><span class="badge">${esc(x.league)}</span>
          <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--live)">
            <span class="dot"></span>${x.minute??"—"}'</span></div>
        <div class="row">
          <span class="team" style="flex:1"><img class="logo" src="${esc(x.home.logo)}" alt=""/>${esc(x.home.name)}</span>
          <span class="score">${x.goals.home??0}–${x.goals.away??0}</span>
          <span class="team" style="flex:1;text-align:right">${esc(x.away.name)}<img class="logo" src="${esc(x.away.logo)}" alt="" style="margin:0 0 0 8px"/></span>
        </div></div>`).join("")
      : `<div class="msg">No major-league matches are live right now.<br/>Auto-refreshes every 90 seconds.</div>`;
  };
  try{ draw(await loadLive()); }catch(e){ m.innerHTML=`<div class="msg">${esc(e.message)}</div>`; return; }
  clearInterval(liveTimer);
  liveTimer=setInterval(async()=>{ if(tab!=="live"){clearInterval(liveTimer);return;}
    try{ draw(await loadLive()); }catch{} }, LIVE_POLL_MS);
}

/* ================= LIVE PREDICTIONS ================= */
async function viewLivePred(){
  const m=$("#main");
  m.innerHTML = wakeNote + spinner("Analysing live matches past 25 minutes…");
  let lastResults=[], lastHistory=[];
  const draw=(results,history)=>{
    lastResults=results; lastHistory=history||[];
    const showLive = resultFilter==="both" || resultFilter==="ongoing";
    const showHist = resultFilter==="both" || resultFilter==="finished";
    m.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin:6px 2px 12px">
        <span class="badge green">≥ 70% ONLY</span>
        <span style="font-size:12px;color:var(--dim)">After 25' · refreshes every 90s</span></div>
      ${filterChipsHTML()}
      ${showLive? (lastResults.length? lastResults.map(r=>`
        <div class="card" style="border-left:3px solid var(--green)">
          <div class="row" style="margin-bottom:8px">
            <span style="font-size:13px;font-weight:600">${esc(r.fixture.home.name)}
              <span class="disp" style="color:var(--gold);font-weight:700">${r.fixture.goals.home??0}–${r.fixture.goals.away??0}</span>
              ${esc(r.fixture.away.name)}</span>
            <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--live)">
              <span class="dot"></span>${r.fixture.minute}'</span></div>
          ${r.predictions.map(p=>`<div class="row" style="padding:7px 0;border-top:1px solid var(--border)">
            <span style="font-size:14px;font-weight:600">${esc(p.market)}</span>${probChip(p.p)}</div>`).join("")}
        </div>`).join("")
      : `<div class="msg">No live match past 25' has a ≥70% signal right now.</div>`) : ""}
      ${showHist && lastHistory.length? `
        <div class="stitle">Today's graded results</div>
        <div class="card" style="padding:0">${lastHistory.map((h,i)=>`
          <div style="display:flex;align-items:center;padding:10px 14px;${i<lastHistory.length-1?"border-bottom:1px solid var(--border)":""}">
            <span style="width:64px;text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:4px 0;border-radius:4px;
              color:${h.result==='correct'?'var(--green)':'var(--red)'};
              background:${h.result==='correct'?'rgba(34,192,141,.12)':'rgba(229,83,75,.12)'}">
              ${h.result==='correct'?'✓ HIT':'✗ MISS'}</span>
            <div style="flex:1;margin-left:10px">
              <div style="font-size:13px;font-weight:600">${esc(h.market)}</div>
              <div style="font-size:11px;color:var(--faint)">${esc(h.match)} · FT ${esc(h.finalScore)}</div>
            </div>
          </div>`).join("")}</div>` : (showHist? `<div class="msg" style="margin-top:8px">No graded results yet today.</div>` : "")}`;
    wireFilterChips(()=>draw(lastResults,lastHistory));
  };
  try{ const d=await api("/api/live-predictions"); draw(d.results, d.history); }
  catch(e){ m.innerHTML=`<div class="msg">${esc(e.message)}</div>`; return; }
  clearInterval(liveTimer);
  liveTimer=setInterval(async()=>{ if(tab!=="livepred"){clearInterval(liveTimer);return;}
    try{ const d=await api("/api/live-predictions"); draw(d.results, d.history); }catch{} }, LIVE_POLL_MS);
}

/* ================= DAILY BOMB ================= */
let bombsCache=[];
function renderBombList(){
  const bombs = bombsCache.filter(b=>passesFilter(b.result));
  $("#main").innerHTML = `
      <div class="card" style="background:rgba(240,80,60,.06);border-color:rgba(240,80,60,.25);margin-bottom:12px">
        <div style="font-size:12px;color:var(--dim);line-height:1.6">
          <span style="color:var(--red);font-weight:700">💣 Daily Bomb — long-shot territory.</span>
          These picks are deliberately LOW probability with a real signal behind them, not pure guesses.
          "Odds" shown are a model estimate (100 ÷ probability), not real bookmaker prices — stake small, they're bombs for a reason.
        </div></div>
      ${filterChipsHTML()}
      ${bombs.length? bombs.map((b,i)=>`
        <div class="card" style="border-left:3px solid ${resultBorder(b.result,'var(--red)')}">
          <div class="row" style="align-items:flex-start;gap:10px">
            <div style="flex:1">
              <div style="display:flex;gap:8px;align-items:center;margin-bottom:5px">
                <span class="disp" style="font-weight:700;color:var(--faint)">💣 #${i+1}</span>
                <span class="badge">${esc(b.league)}</span></div>
              <div style="font-size:13px;color:var(--dim);margin-bottom:3px">${esc(b.match)}</div>
              <div>${copyChip(b.home)}${copyChip(b.away)}</div>
              <div class="disp" style="font-weight:700;font-size:20px">${esc(b.market)}</div>
              <div style="font-size:11px;color:var(--faint);margin-top:5px">
                KO ${new Date(b.kickoff).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>
              ${resultBadge(b.result,b.finalScore)}
            </div>
            <div style="text-align:right;min-width:66px">
              <div class="disp" style="font-weight:700;font-size:26px;color:var(--red)">@${b.impliedOdds.toFixed(2)}</div>
              <div style="margin-top:6px">${probChip(b.p)}</div>
            </div>
          </div></div>`).join("")
      : `<div class="msg">No bombs match this filter.</div>`}`;

}
async function viewHighOdds(){
  const m=$("#main");
  m.innerHTML = wakeNote + spinner("Hunting today's boldest long-shots…");
  try{
    const {bombs}=await api("/api/daily-bomb");
    bombsCache = bombs;
    renderBombList();
  }catch(e){ m.innerHTML=`<div class="msg">Couldn't load today's bomb: ${esc(e.message)}</div>`; }
}

/* ================= CORRECT SCORE ================= */
// Correct-score confidence uses its own scale — even a strong pick in this
// market is usually 10-30%, nothing like the 1X2/goals markets elsewhere.
const csColor = p => p>=18?"var(--green)":p>=11?"var(--amber)":"var(--red)";
const csLabel = p => p>=18?"STRONGEST SIGNAL":p>=11?"REASONABLE LEAN":"TOSS-UP";

let cscoreCache=[];
function renderCScoreList(){
  const picks = cscoreCache.filter(p=>passesFilter(p.result));
  $("#main").innerHTML = `
      <div class="card" style="background:rgba(91,124,250,.06);border-color:rgba(91,124,250,.25);margin-bottom:12px">
        <div style="font-size:12px;color:var(--dim);line-height:1.6">
          <span style="color:var(--gold);font-weight:700">Correct Score — read the ranking, not the raw %.</span>
          Exact scorelines are naturally low-probability in football — even the model's best single pick is usually only 10–30% likely.
          Picks are ranked by how much clearer the top pick is over the runner-up, not by percentage alone.
        </div></div>
      ${filterChipsHTML()}
      ${picks.length? picks.map((p,i)=>`
        <div class="card" style="border-left:3px solid ${resultBorder(p.result,csColor(p.p))}">
          <div class="row" style="align-items:flex-start;gap:10px">
            <div style="flex:1">
              <div style="display:flex;gap:8px;align-items:center;margin-bottom:5px">
                <span class="disp" style="font-weight:700;color:var(--faint)">#${i+1}</span>
                <span class="badge">${esc(p.league)}</span></div>
              <div style="font-size:13px;color:var(--dim);margin-bottom:3px">${esc(p.match)}</div>
              <div>${copyChip(p.home)}${copyChip(p.away)}</div>
              <div class="disp" style="font-weight:700;font-size:26px">${esc(p.score)}</div>
              <div style="font-size:10.5px;color:${csColor(p.p)};font-weight:700;letter-spacing:1px;margin-top:5px">${csLabel(p.p)}</div>
              <div style="font-size:11px;color:var(--faint);margin-top:6px">
                Runner-up: ${esc(p.runnerUp.score)} at ${p.runnerUp.p}% · KO ${new Date(p.kickoff).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>
              ${resultBadge(p.result,p.finalScore)}
            </div>
            <div style="text-align:right;min-width:56px">
              <div class="disp" style="font-weight:700;font-size:24px;color:${csColor(p.p)}">${p.p}%</div>
            </div>
          </div></div>`).join("")
      : `<div class="msg">No picks match this filter.</div>`}`;
  wireFilterChips(renderCScoreList);
}
async function viewCScore(){
  const m=$("#main");
  m.innerHTML = wakeNote + spinner("Running the goal model on today's fixtures…");
  try{
    const {picks}=await api("/api/correct-score");
    cscoreCache = picks;
    renderCScoreList();
  }catch(e){ m.innerHTML=`<div class="msg">Couldn't load correct-score picks: ${esc(e.message)}</div>`; }
}

/* ================= ROUTER ================= */
function render(){
  if(gateStage){ renderGate(); return; }
  role = getRole();
  if(!role){ gateStage = hasPassword() ? "choice" : "setup"; renderGate(); return; }
  if(role==="guest" && !GUEST_TABS.includes(tab)) tab="stats";
  renderNav();
  renderRoleControls();
  clearInterval(liveTimer);
  ({today:viewToday,stats:viewStats,top:viewTop,live:viewLive,livepred:viewLivePred,highodds:viewHighOdds,cscore:viewCScore})[tab]();
}
render();
loadLive().catch(()=>{});
</script>
